# Un PR por ecosistema con todas las actualizaciones menores y de parche.
# Las versiones mayores se ignoran: rompen compatibilidad (Django 6 pide
# Python 3.12 y el Dockerfile usa 3.10; Tailwind 4 cambia la configuración)
# y se hacen a mano en una rama propia.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 26.2 exige Python 3.11; quitar cuando el Dockerfile suba de 3.10.
      - dependency-name: "django-filter"
        versions: [">=26.2"]
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
