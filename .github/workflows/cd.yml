# Entrega continua: cada merge a main publica la imagen del backend en GitHub
# Container Registry. Un tag vX.Y.Z (ej. v1.0.0) además crea un Release con el
# build del frontend y notas generadas a partir de los PRs.
name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-image:
    name: Publicar imagen backend (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Empaquetar
        run: cd dist && zip -r ../aula-libre-frontend.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: frontend/aula-libre-frontend.zip

  release:
    name: Crear Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend-image, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-release

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: aula-libre-frontend.zip
