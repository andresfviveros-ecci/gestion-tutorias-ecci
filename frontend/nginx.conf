server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La app usa React Router: cualquier ruta que no sea un archivo
    # devuelve index.html para que el enrutamiento lo haga el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de assets llevan hash en el nombre; se pueden cachear.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
