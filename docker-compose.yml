# Entorno completo de desarrollo: base de datos, backend y frontend.
# Todas las variables se leen del .env de la raíz (plantilla en .env.example).
name: gestion-tutorias

services:
  db:
    image: postgres:16
    container_name: tutorias_ecci_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorias_ecci}
      POSTGRES_USER: ${POSTGRES_USER:-tutorias_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tutorias_user} -d ${POSTGRES_DB:-tutorias_ecci}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inicio configuración Django
  tutorias-django:
    container_name: tutorias_ecci
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Al arrancar aplica migraciones y, si SEED_DEMO=1, carga los datos de prueba
    # (solo la primera vez; ver backend/apps/accounts/management/commands/datos_prueba.py).
    command: >
      bash -c "python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      if [ \"$$SEED_DEMO\" = \"1\" ]; then python manage.py datos_prueba; fi &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/backend
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorias_ecci}
      POSTGRES_USER: ${POSTGRES_USER:-tutorias_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
      # Dentro de la red de Docker la base siempre es db:5432, sin importar POSTGRES_PORT.
      POSTGRES_HOST: db
      POSTGRES_INTERNAL_PORT: "5432"
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      SEED_DEMO: ${SEED_DEMO:-1}
      # Misma lista que el frontend: una sola variable para los dos.
      EMAIL_DOMAINS: ${VITE_EMAIL_DOMAINS:-ecci.edu.co,aulalibre.test}
      # Consola por defecto en desarrollo: el PIN de recuperación sale en los logs.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      THROTTLE_RECOVERY: ${THROTTLE_RECOVERY:-5/hour}
      THROTTLE_CHANGE_PASSWORD: ${THROTTLE_CHANGE_PASSWORD:-10/hour}
    depends_on:
      db:
        condition: service_healthy
    # Queda "healthy" cuando la API responde, después de migrar y cargar datos.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/')"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 120s
  # Fin configuración Django

  frontend:
    container_name: tutorias_ecci_frontend
    build:
      context: ./frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # node_modules se queda el de la imagen (Linux), no el de la máquina.
      - /app/node_modules
    environment:
      # El navegador llama a la API desde la máquina, por eso va con el puerto publicado.
      VITE_API_URL: http://localhost:${APP_PORT:-8000}/api
      VITE_EMAIL_DOMAINS: ${VITE_EMAIL_DOMAINS:-ecci.edu.co,aulalibre.test}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    depends_on:
      tutorias-django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
