services:
  db:
    image: postgres:16
    container_name: tutorias_ecci_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorias_ecci}
      POSTGRES_USER: ${POSTGRES_USER:-tutorias_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorias_user} -d ${POSTGRES_DB:-tutorias_ecci}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inicio configuración Django
  tutorias-django:
    container_name: tutorias_ecci
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: bash -c "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/backend
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  # Fin configuración Django

volumes:
  postgres_data: