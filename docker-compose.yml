services:
  db:
    image: postgres:16
    container_name: tutorias_ecci_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorias_ecci}
      POSTGRES_USER: ${POSTGRES_USER:-tutorias_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorias_user} -d ${POSTGRES_DB:-tutorias_ecci}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
